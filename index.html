<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="G-STUDIO">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>G-STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--body:#0c0d0e;--ch1:#232427;--ch2:#1b1c1e;--well:#111213;--tx:#cfd0d4;--dim:#7a7c82;--faint:#4b4d52;--amb:#e8a04a;--grn:#62c481;--red:#d9665c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--body);color:var(--tx);font-family:"Archivo",system-ui,sans-serif;font-size:13px;overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body{height:100dvh;padding:8px;display:flex}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
.lbl{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-stretch:85%}

/* chassi */
.dev{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:linear-gradient(180deg,var(--ch1),var(--ch2));border:1px solid #2e2f33;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 40px rgba(0,0,0,.6);min-height:0}

/* faixa de controles */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 11px;padding:0 2px 9px;border-bottom:1px solid #111;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.logo{display:flex;align-items:center;gap:10px;padding-right:2px}
.mark{width:32px;height:32px;flex:none;border-radius:8px;background:linear-gradient(180deg,#17181a,#101112);border:1px solid #000;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.word{font-weight:800;font-stretch:72%;font-size:17px;letter-spacing:.12em;color:#dcdde0;text-shadow:0 1px 0 rgba(0,0,0,.8);white-space:nowrap}
.word em{font-style:normal;color:var(--amb)}
.lcdwrap{display:flex;align-items:center;gap:6px}
.lcd{display:grid;grid-template-columns:auto auto;column-gap:16px;align-items:end;padding:7px 12px 6px;min-width:204px;background:#090a0a;border-radius:6px;border:1px solid #000;box-shadow:inset 0 2px 6px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.05);color:var(--amb);text-shadow:0 0 8px rgba(232,160,74,.35);font-variant-numeric:tabular-nums}
.lcd .bpm{font-size:27px;font-weight:600;font-stretch:78%;line-height:1;touch-action:none}
.lcd .bpm small{font-size:9.5px;letter-spacing:.14em;margin-left:5px;opacity:.55;font-weight:600}
.lcd .pos{font-size:18px;font-weight:500;font-stretch:78%;justify-self:end;line-height:1}
.lcd .msg{grid-column:1/3;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.vbtn{display:flex;flex-direction:column;gap:4px}

.hw{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 12px;border-radius:7px;background:linear-gradient(180deg,#313236,#26272a);border:1px solid #0e0e0f;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 3px rgba(0,0,0,.45);color:#d4d5d8;font-size:10.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;font-stretch:85%;white-space:nowrap}
.hw:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.hw:disabled{opacity:.28;pointer-events:none}
.hw svg{width:14px;height:14px;fill:currentColor;flex:none}
.sq{width:46px;padding:0}
.mini{width:30px;height:17px;padding:0;font-size:12px;border-radius:5px;letter-spacing:0}
.led{width:6px;height:6px;border-radius:50%;background:#2b2c2f;box-shadow:inset 0 1px 1px rgba(0,0,0,.7);flex:none}
.on>.led{background:var(--amb);box-shadow:0 0 6px var(--amb)}
#play.on>.led,.sc.on>.led{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.rocker{display:flex;border-radius:7px;border:1px solid #0e0e0f;box-shadow:0 2px 3px rgba(0,0,0,.45);overflow:hidden}
.rocker button{height:38px;padding:0 12px;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#2f3034,#25262a);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);color:#9fa1a6;font-size:10.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;font-stretch:85%;white-space:nowrap}
.rocker button+button{border-left:1px solid #0e0e0f}
.rocker button.on{background:linear-gradient(180deg,#1c1d1f,#222326);box-shadow:inset 0 2px 5px rgba(0,0,0,.65);color:#f0f0f0}
.spacer{flex:1}
.grpl{display:flex;flex-direction:column;gap:4px}
.knobs{display:flex;gap:12px;align-items:flex-end}

/* knobs */
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:ns-resize}
.knob svg{width:40px;height:40px;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.knob.sm svg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.knob .cap{fill:#2c2d31;stroke:#0e0e0f;stroke-width:1}
.knob .trk{fill:none;stroke:#0e0f10;stroke-width:3;stroke-linecap:round}
.knob .val{fill:none;stroke:var(--kc,var(--amb));stroke-width:3;stroke-linecap:round}
.knob .ptr{stroke:#e8e8e8;stroke-width:2;stroke-linecap:round}
.knob.sm .trk,.knob.sm .val{stroke-width:2.2}
.knob.sm .ptr{stroke-width:1.6}

/* sessão */
.well{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:10px;background:var(--well);border:1px solid #08090a;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.04)}
.tabs{display:flex;gap:3px;padding-left:22px;margin-bottom:-9px;position:relative;z-index:1}
.tabs .tab{height:28px;padding:0 18px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#1d1e20,#18191b);border:1px solid #08090a;border-bottom:0;color:var(--dim);font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;font-stretch:85%}
.tabs .tab.on{background:var(--well);color:#e6e7e9;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ruler{display:grid;grid-template-columns:14px 1fr;column-gap:6px;flex:none}
.rl{display:grid;grid-template-columns:var(--hw,150px) repeat(8,minmax(0,1fr)) var(--sw,176px);gap:4px}
.rl span{position:relative;font-size:9px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-stretch:85%;text-align:center;padding:2px 0 1px}
.rl .c0{text-align:left;padding-left:12px}
.rz-w,.rz-s{position:absolute;top:-6px;bottom:-4px;width:20px;cursor:col-resize;touch-action:none;z-index:3}
.rz-w{right:-12px}.rz-s{left:-12px}
.rz-w::after,.rz-s::after{content:"";position:absolute;left:9px;top:3px;bottom:1px;width:2px;border-radius:1px;background:#3a3b40}
.rz-w.act::after,.rz-s.act::after{background:var(--amb)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:14px 1fr;column-gap:6px;row-gap:4px;-webkit-overflow-scrolling:touch}
.rz-h{position:absolute;left:0;bottom:-7px;width:var(--hw,150px);height:12px;cursor:row-resize;touch-action:none;z-index:3}
.rz-h::after{content:"";position:absolute;left:50%;top:1px;width:26px;height:3px;margin-left:-13px;border-radius:2px;background:#36373b}
.rz-h.act::after{background:var(--amb);width:60px;margin-left:-30px}
.rm{display:none;width:22px;height:22px;flex:none;border-radius:4px;color:var(--red);background:#2a1f1f;border:1px solid #0e0e0f;align-items:center;justify-content:center}
.rm svg{width:12px;height:12px}
body.editing .rm{display:flex}
.addrow{border:1px dashed #2c2d31;border-radius:5px;color:var(--dim);font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;font-stretch:85%}
.addrow:active{background:#1a1b1d}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--dim)}
.empty-state b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-stretch:85%;color:#d8d9dc}
.empty-state span{font-size:13px}
.empty-state .hw{height:44px;padding:0 20px;margin-top:6px}
.sheet.small{width:min(560px,100%)}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pk{height:54px;justify-content:flex-start;padding:0 12px;gap:10px;text-align:left}
.pk i{width:4px;height:24px;border-radius:1px;background:var(--c);flex:none}
.pk span{display:flex;flex-direction:column;gap:3px}
.pk small{font-size:8.5px;color:var(--dim);letter-spacing:.14em}
.gl{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:9px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--faint);font-stretch:80%;border-left:1px solid #1f2023}
.lane{position:relative;min-height:0;display:grid;grid-template-columns:var(--hw,150px) repeat(8,minmax(0,1fr)) var(--sw,176px);gap:4px}
#session.compact .lh{flex-wrap:wrap;align-content:center;row-gap:6px}
#session.compact .lh .nmw{flex-basis:100%}
.lh{position:relative;display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;border-radius:5px;background:#1b1c1e;border:1px solid #242528;min-width:0;overflow:hidden;--kc:var(--c)}
.lh .tab{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.lh b{flex:1;min-width:0;font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;font-stretch:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mute{width:26px;height:22px;flex:none;border-radius:4px;background:linear-gradient(180deg,#2e2f33,#242528);border:1px solid #0e0e0f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-size:9.5px;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center}
.mute.on{background:var(--amb);color:#1d1306;box-shadow:0 0 8px rgba(232,160,74,.4)}

.clip{position:relative;display:flex;align-items:center;padding:0 8px 0 11px;border-radius:5px;background:#1c1d20;border:1px solid #27282c;color:#a9abb0;font-size:clamp(10px,1.25vw,12.5px);font-weight:500;font-stretch:90%;text-align:left;min-width:0;overflow:hidden}
.clip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.clip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .pg{position:absolute;left:0;bottom:0;height:2px;width:0;background:rgba(0,0,0,.45)}
.clip:active{filter:brightness(1.2)}
.clip.play{background:var(--c);border-color:transparent;color:#111;font-weight:700;box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.clip.q{border-color:var(--c);animation:bl .38s steps(2) infinite}
@keyframes bl{50%{background:color-mix(in srgb,var(--c) 40%,#1c1d20)}}
.clip.empty{background:transparent;border:1px dashed #26272b;color:var(--faint);justify-content:center;font-size:15px;padding:0}
.clip.empty::before{display:none}
.clip.user::after{content:"";position:absolute;right:6px;top:6px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
body.editing .clip:not(.empty){border-style:dashed;border-color:#6a6b70}
.lane.muted .clip,.lane.muted .strip{opacity:.33}
.strip{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;padding:9px 6px;background:#0a0b0b;border-radius:5px;border:1px solid #000;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.strip i{background:#1b1c1e;border-radius:1px}
.strip i:nth-child(4n+1){background:#25262a}
.strip i.hit{background:var(--c)}
.strip i.ph{box-shadow:inset 0 0 0 1px #eaeaea}

/* cenas */
#scenes{display:flex;gap:6px}
#scenes .sc{flex:1;min-width:0;height:46px;justify-content:flex-start;padding:0 11px;gap:8px}
.sc b{font-size:15px;font-weight:600;font-stretch:80%;letter-spacing:0}
.sc span:last-child{color:var(--dim)}
.sc.empty{background:linear-gradient(180deg,#232427,#1e1f22);color:var(--faint)}
.sc.empty span:last-child{color:var(--faint)}
body.editing .sc{outline:1px dashed #6a6b70;outline-offset:-4px}
#stopall{flex:.9!important;justify-content:center!important}

/* janelas */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:1000;padding:12px}
.modal.open{display:flex}
.sheet{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(180deg,var(--ch1),var(--ch2));border:1px solid #2e2f33;box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-stretch:85%}
.sh-title i{width:10px;height:10px;border-radius:2px;background:var(--c,var(--amb))}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:30px;padding:0 10px;font-size:10px}
.chip.sel{background:var(--amb);color:#1d1306;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.chip.filled::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.rocker.small button{height:30px;padding:0 10px;font-size:10px}
.rocker button:disabled{opacity:.3}
#edGrid,#mgrid{min-height:0;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:8px;border-radius:8px;background:var(--well);border:1px solid #08090a;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
#mgrid{gap:5px}
.edbar{display:flex;flex-direction:column;gap:4px}
.edrow{display:grid;grid-template-columns:48px repeat(16,1fr);gap:3px;align-items:stretch}
.edrow .lbl{align-self:center}
.cell{height:clamp(38px,8vh,60px);border-radius:3px;background:#1c1d20;touch-action:none}
.cell.beat{background:#25262a}
.cell.on{background:var(--cc);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.cell.ph,.ncell.ph{box-shadow:inset 0 0 0 2px #ececec}
.nroll{display:flex;flex-direction:column;gap:2px}
.nrow{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:stretch}
.nrow span{font-size:9.5px;font-weight:600;color:#5c5e63;align-self:center;padding-left:3px;font-stretch:85%}
.nrow.root span{color:#c9cacd}
.ncell{height:clamp(20px,3.4vh,30px);border-radius:2px;background:#1a1b1d;touch-action:none}
.ncell.beat{background:#222326}
.nrow.root .ncell{background:#25221e}
.nrow.root .ncell.beat{background:#2c2823}
.ncell.on{background:var(--cc);border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ncell.on:not(.end){margin-right:-2px}
.ncell.st{border-radius:4px 0 0 4px}.ncell.end{border-radius:0 4px 4px 0}.ncell.st.end{border-radius:4px}
.mfoot{display:flex;gap:6px;flex-wrap:wrap}
.mfoot .hw{flex:1;min-width:84px;height:44px}
.hw.pri{background:linear-gradient(180deg,#66c785,#4fa96c);color:#0b1a10;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 3px rgba(0,0,0,.45)}
.hw.danger{color:var(--red)}
.mrow{display:grid;grid-template-columns:92px repeat(9,1fr);gap:4px;align-items:stretch}
.mrow .nmr{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;font-stretch:85%;white-space:nowrap;overflow:hidden}
.mrow .nmr i{width:4px;height:16px;border-radius:1px;background:var(--c);flex:none}
.mrow .hw{height:32px;padding:0;font-size:10px;letter-spacing:.06em}
.mrow .hw.sel{background:var(--c);color:#111;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.mrow .hw.off.sel{background:#5b302c;color:#f1d6d2}

/* efeitos */
.fxbtns{display:flex;gap:4px}
.fxbtn{padding:0 10px}
.fxbtn.open{background:linear-gradient(180deg,#1c1d1f,#222326);box-shadow:inset 0 2px 5px rgba(0,0,0,.65);color:#fff}
.nmw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fxt{font-size:8.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--amb);font-stretch:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxt:empty{display:none}
.plug{position:fixed;display:none;flex-direction:column;max-height:calc(100dvh - 8px);border-radius:14px;background:linear-gradient(180deg,#2a2b2f,#1c1d20);border:1px solid #34353a;box-shadow:0 22px 50px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);z-index:20;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(180deg,#303136,#26272b);border-bottom:1px solid #111;cursor:move;touch-action:none;flex:none}
.pw{width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(180deg,#323337,#232427);border:1px solid #0e0e0f;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 3px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pw .led{width:8px;height:8px}
.pw.on>.led{background:var(--grn);box-shadow:0 0 7px var(--grn)}
.pt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pt b{font-size:13px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;font-stretch:80%}
.pt small{font-size:8px;letter-spacing:.24em;color:var(--dim);font-weight:600}
.px{width:30px;height:30px;flex:none;border-radius:6px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.px svg{width:14px;height:14px}
.px:active{background:#1a1b1d}
.pbody{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 14px 18px;overflow-y:auto;min-height:0}
.pbody>*{flex-shrink:0}
.plug.off .bigk,.plug.off .smk,.plug.off .plcd{opacity:.4}
.pst{align-self:stretch}.pst button{flex:1;justify-content:center}
.bigk{width:calc(var(--w,340px)*.6);max-width:100%;touch-action:none;cursor:ns-resize}
.bk{display:block;width:100%;height:auto;overflow:visible}
.bk .tk{stroke:#55575c;stroke-width:1.2}.bk .tk.maj{stroke:#8a8c92;stroke-width:1.8}
.bk text{fill:#7d7f85;font-size:9px;font-family:"Archivo",sans-serif;font-weight:600;text-anchor:middle}
.bk .trk{fill:none;stroke:#0c0d0e;stroke-width:4;stroke-linecap:round}
.bk .val{fill:none;stroke:var(--amb);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(232,160,74,.55))}
.bk .knurl line{stroke:#0c0c0d;stroke-width:1.6;opacity:.7}
.bk .ind{stroke:var(--amb);stroke-width:4.5;stroke-linecap:round}
.plcd{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px;background:#090a0a;border:1px solid #000;border-radius:6px;box-shadow:inset 0 2px 5px rgba(0,0,0,.85);color:var(--amb);text-shadow:0 0 8px rgba(232,160,74,.35);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.1em;font-stretch:80%}
.pv{font-size:15px;font-weight:600;white-space:nowrap}.pi{font-size:9.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smk{display:flex;justify-content:center;gap:34px}
.lk{align-self:stretch;height:40px;flex:none}
.lk svg{width:15px;height:15px}
.lkc{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#151618;color:var(--dim);font-size:10px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}

 kick:{name:'Kick',color:'#ffb23d',vol:.9},
 clap:{name:'Clap',color:'#ff9447',vol:.6},
 snare:{name:'Snare',color:'#ff7a4f',vol:.6},
 hat:{name:'Hi-hat',color:'#ffd166',vol:.45},
 ohat:{name:'Open Hat',color:'#ffad5c',vol:.4},
 tom:{name:'Toms',color:'#ff8a6b',vol:.7,rows:[{l:'Alto',f:200},{l:'Médio',f:150},{l:'Grave',f:110}]},
 perc:{name:'Perc',color:'#ffc38a',vol:.4},
 bass:{name:'Baixo',color:'#5b8cff',vol:.8,kind:'note',range:[28,57]},
 chord:{name:'Acordes',color:'#8a6bff',vol:.55,kind:'note',range:[48,76]},
 lead:{name:'Lead / FX',color:'#4fc3ff',vol:.5,kind:'note',range:[64,93]}

function makeLane(type,key,name){

  return {key,type,name:name||T.name,color:T.color,vol:T.vol,kind:T.kind||'drum',rows:T.rows||[{l:T.name}],range:T.range,h:null,
    active:-1,queued:null,muted:false,preview:null,gain:null,padEls:[],padNm:[],padPg:[],pgIdx:-1,cells:[],shown:''};
}

// ---------- Áudio ----------
function initAudio(){
  if(ctx){ctx.resume&&ctx.resume();return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();fin=ctx.createGain();comp.connect(fin);fin.connect(ctx.destination);setupMeters();
  out=ctx.createGain();out.gain.value=K.mv;out.connect(comp);
  filt=ctx.createBiquadFilter();filt.type='lowpass';filt.Q.value=3;setFilter();
  mix=ctx.createGain();mix.connect(filt);filt.connect(out);
  buildFxAudio();
  ALL().forEach(ensureGain);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  ctx.resume&&ctx.resume();
  const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);
}
// cadeia de cada linha: volume -> (seco | distorção) -> saída -> mix + envios de reverb e delay
function ensureGain(c){
  if(ctx&&!c.gain){
    c.gain=ctx.createGain();c.post=ctx.createGain();
    c.dDry=ctx.createGain();c.dPre=ctx.createGain();c.dTone=ctx.createBiquadFilter();c.dTone.type='lowpass';
    c.dWet=ctx.createGain();c.dWet.gain.value=0;
    c.sRev=ctx.createGain();c.sRev.gain.value=0;c.sDly=ctx.createGain();c.sDly.gain.value=0;
    c.gain.connect(c.dDry);c.dDry.connect(c.post);
    c.gain.connect(c.dPre);makeShaper(c);c.dTone.connect(c.dWet);c.dWet.connect(c.post);
    c.post.connect(mix);c.post.connect(c.sRev);c.post.connect(c.sDly);
    c.an=ctx.createAnalyser();c.an.fftSize=256;c.post.connect(c.an);
    c.sRev.connect(FXA.rev.in);c.sDly.connect(FXA.dly.in);
  }
  applyGain(c);routeLane(c);
}
function applyGain(c){if(c.gain)c.gain.gain.value=c.muted?0:c.vol}
function setFilter(){if(filt)filt.frequency.value=200*Math.pow(100,K.fv)}
function setMaster(){if(out)out.gain.value=K.mv}
function setBpmDelay(){if(ctx&&FXA.dly.in)updDly();if(FX.dly.el)updPlugLcd('dly')}

function noise(t,dur){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t,Math.random());s.stop(t+dur);return s}
function kick(t,o){
  const k=snd().kick,x=ctx.createOscillator(),g=ctx.createGain();
  x.frequency.setValueAtTime(k[0],t);x.frequency.exponentialRampToValueAtTime(k[1],t+.13);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+k[2]);x.connect(g).connect(o);x.start(t);x.stop(t+k[2]+.05);
  if(k[3]){const n=noise(t,.03),f=ctx.createBiquadFilter(),g2=ctx.createGain();f.type='highpass';f.frequency.value=2500;g2.gain.setValueAtTime(.35,t);g2.gain.exponentialRampToValueAtTime(.001,t+.012);n.connect(f).connect(g2).connect(o)}
}
function clapOnly(t,o){
  const c=snd().clap,f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=c[0];f.Q.value=1;
  const n=noise(t,c[1]+.1);g.gain.setValueAtTime(.0001,t);
  [0,.011,.022].forEach(d=>{g.gain.setValueAtTime(.8,t+d);g.gain.exponentialRampToValueAtTime(.15,t+d+.009)});
  g.gain.setValueAtTime(.7,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+c[1]);
  n.connect(f).connect(g).connect(o)}
function snare(t,o){
  const S=snd().snr,x=ctx.createOscillator(),g=ctx.createGain();x.type='triangle';x.frequency.setValueAtTime(S[0],t);x.frequency.exponentialRampToValueAtTime(S[0]*.62,t+.08);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);x.connect(g).connect(o);x.start(t);x.stop(t+.16);
  const n=noise(t,S[2]+.05),f=ctx.createBiquadFilter(),g2=ctx.createGain();f.type='highpass';f.frequency.value=S[1];g2.gain.setValueAtTime(.55,t);g2.gain.exponentialRampToValueAtTime(.001,t+S[2]);n.connect(f).connect(g2).connect(o)}
function tom(t,fr,o){const T=snd().tom,f0=fr*T[0],x=ctx.createOscillator(),g=ctx.createGain();x.frequency.setValueAtTime(f0*1.6,t);x.frequency.exponentialRampToValueAtTime(f0,t+.09);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+T[1]);x.connect(g).connect(o);x.start(t);x.stop(t+T[1]+.03)}
function rim(t,o){const R=snd().rim,x=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();x.type='square';x.frequency.value=R[0];f.type='bandpass';f.frequency.value=R[1];f.Q.value=4;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);x.connect(f).connect(g).connect(o);x.start(t);x.stop(t+.06)}
function hat(t,o,open){
  const dec=open?.3:.05;
  if(snd().metal){
    const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=7000;
    g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);
    [205.3,304.4,369.6,522.7,540,800].forEach(fr=>{const x=ctx.createOscillator();x.type='square';x.frequency.value=fr;x.connect(f);x.start(t);x.stop(t+dec+.02)});
    f.connect(g).connect(o);return;
  }
  const n=noise(t,open?.35:.08),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=7500;g.gain.setValueAtTime(open?.22:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);n.connect(f).connect(g).connect(o)}
function acid303(t,m,dur,o,pos){
  const acc=(pos%4===2),gate=Math.min(Math.max(dur,.06),.35);
  const a=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  a.type='sawtooth';a.frequency.value=m2f(m+12);
  f.type='lowpass';f.Q.value=acc?18:13;
  f.frequency.setValueAtTime(acc?5200:2600,t);f.frequency.exponentialRampToValueAtTime(260,t+(acc?.22:.16));
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(acc?.62:.42,t+.006);g.gain.setTargetAtTime(.0001,t+gate,.03);
  a.connect(f).connect(g).connect(o);a.start(t);a.stop(t+gate+.3)}
function bass(t,m,dur,o,pos){
  if(snd().bass303){acid303(t,m,dur,o,pos);return}
  dur=Math.max(dur,.06);const a=ctx.createOscillator(),b=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();a.type='sawtooth';a.frequency.value=m2f(m);b.type='sine';b.frequency.value=m2f(m);f.type='lowpass';f.Q.value=6;f.frequency.setValueAtTime(1200,t);f.frequency.exponentialRampToValueAtTime(180,t+.15);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.5,t+.008);g.gain.setTargetAtTime(.0001,t+dur,.04);a.connect(f);b.connect(f);f.connect(g).connect(o);a.start(t);b.start(t);a.stop(t+dur+.3);b.stop(t+dur+.3)}
function chord(t,notes,dur,pad,o){
  dur=Math.max(dur,.08);const C=snd().chord,f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.Q.value=C[1];
  if(pad){f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(1800,t+dur*.6)}else{f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(700,t+dur)}
  const att=pad?Math.min(.8,dur/2):.01;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+att);g.gain.setTargetAtTime(.0001,t+dur,pad?.25:.05);
  notes.forEach(n=>[-8,8].forEach(dt=>{const x=ctx.createOscillator();x.type=C[0];x.frequency.value=m2f(n);x.detune.value=dt;x.connect(f);x.start(t);x.stop(t+dur+(pad?1.5:.4))}));
  f.connect(g).connect(o)}
function pluck(t,m,dur,o){
  dur=Math.max(dur,.1);const L=snd().lead,x=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  x.type=L[0];x.frequency.value=m2f(m);f.type='lowpass';f.Q.value=L[1];f.frequency.setValueAtTime(L[2],t);f.frequency.exponentialRampToValueAtTime(600,t+.15);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.13,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+dur+.1);x.connect(f).connect(g).connect(o);x.start(t);x.stop(t+dur+.15)}
function sweep(t,dur,o){const n=noise(t,dur+.1),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.25,t+dur);g.gain.linearRampToValueAtTime(.0001,t+dur+.08);n.connect(f).connect(g).connect(o)}

function playCol(c,s,t){
  const pat=c.preview||(c.active>=0?getPat(c,c.active):null);
  if(!pat)return;
  const d=pat.data,L=pat.len||16,pos=L===32?(bar%2)*16+s:s,sd=60/bpm/4,o=c.gain;
  switch(c.type){
    case 'kick':if(d.includes(pos)){kick(t,o);if(!c.muted&&c.vol>.05)PQ.push({t,v:1})}break;
    case 'clap':if(d.includes(pos))clapOnly(t,o);break;
    case 'snare':if(d.includes(pos))snare(t,o);break;
    case 'hat':if(d.includes(pos))hat(t,o,false);break;
    case 'ohat':if(d.includes(pos))hat(t,o,true);break;
    case 'perc':if(d.includes(pos))rim(t,o);break;
    case 'tom':d.forEach(n=>{if(n[0]===pos)tom(t,n[1],o)});break;
    case 'lead':
      if(d==='sweep'){if(pos===0)sweep(t,sd*16,o);break}
      d.forEach(n=>{if(n[0]===pos)pluck(t,n[1],n[2]*sd,o)});break;
    case 'bass':d.forEach(n=>{if(n[0]===pos)bass(t,n[1],n[2]*sd,o,pos)});break;
    case 'chord':d.forEach(n=>{if(n[0]===pos)chord(t,n[1],n[2]*sd,n[3],o)});break;
  }
}
function hitsOf(pat,half){
  if(!pat)return new Set();
  const d=pat.data,r=new Set(),add=v=>{const i=v-half*16;if(i>=0&&i<16)r.add(i)};
  if(d==='sweep')add(0);else d.forEach(x=>add(Array.isArray(x)?x[0]:x));
  return r;
}


// ---------- Relógio ----------
function applyQueues(){
  cols.forEach(c=>{
    if(c.queued===null)return;
    const cp=c.active>=0?getPat(c,c.active):null,np=c.queued>=0?getPat(c,c.queued):null;
    const long=(cp&&cp.len===32)||(np&&np.len===32);
    if(long&&bar%2===1)return;
    c.active=c.queued;c.queued=null;
  });
}
function tick(){
  while(nextTime<ctx.currentTime+.12){
    if(step===0)applyQueues();
    if(step%4===0&&cols.some(c=>c.active>=0))PQ.push({t:nextTime,v:.4});
    cols.forEach(c=>playCol(c,step,nextTime));
    uiQ.push({t:nextTime,s:step,b:bar});
    nextTime+=60/bpm/4;step++;if(step===16){step=0;bar++}
  }
}
function setPlayUI(){$('#playIco').innerHTML=playing?ICON.stop:ICON.play;$('#play').classList.toggle('on',playing)}
function startTransport(){
  step=0;bar=0;nextTime=ctx.currentTime+.06;playing=true;
  clearInterval(timer);timer=setInterval(tick,25);tick();setPlayUI();
}
function stopTransport(){
  clearInterval(timer);playing=false;uiQ.length=0;PQ.length=0;cur=-1;curBar=0;sceneOn=-1;
  ALL().forEach(c=>{c.active=-1;c.queued=null;c.preview=null});
  setPlayUI();
  if(ED.ci>=0){ED.prev=false;$('#cePrev').classList.remove('on')}
}
function tap(ci,pi){
  initAudio();sceneOn=-1;
  const c=cols[ci];
  if(!playing){c.active=pi;c.queued=null;startTransport();return}
  const target=c.queued!==null?c.queued:c.active;
  const nt=target===pi?-1:pi;
  c.queued=(nt===c.active)?null:nt;
}
function padTap(ci,pi){
  const pat=getPat(cols[ci],pi);
  if(editMode||!pat){openClipEditor(ci,pi);return}
  tap(ci,pi);
}
function stopAll(){if(!playing)return;cols.forEach(c=>{c.queued=(c.active===-1)?null:-1})}

// ---------- Cenas ----------
function launchScene(i){
  const sc=scenes[i];
  if(!sc){openSceneEditor(i);return}
  if(!cols.length){flash('Adicione um instrumento');return}
  initAudio();sceneOn=i;
  const slot=c=>{const v=sc[c.key];return Number.isInteger(v)&&getPat(c,v)?v:-1};
  if(!playing){cols.forEach(c=>{c.active=slot(c);c.queued=null});startTransport();return}
  cols.forEach(c=>{const v=slot(c);c.queued=(v===c.active)?null:v});
}
const curMap=()=>{const o={};cols.forEach(c=>o[c.key]=c.active);return o};
const draftOf=c=>Number.isInteger(draft[c.key])?draft[c.key]:-1;
function openSceneEditor(i){
  if(!cols.length){flash('Adicione um instrumento primeiro');return}
  editing=i;
  draft=scenes[i]?Object.assign({},scenes[i]):curMap();
  $('#mt').textContent='Cena '+(i+1);
  renderSceneEditor();$('#sceneEd').classList.add('open');
}
function renderSceneEditor(){
  const g=$('#mgrid');g.innerHTML='';
  cols.forEach(c=>{
    const r=document.createElement('div');r.className='mrow';r.style.setProperty('--c',c.color);
    const n=document.createElement('div');n.className='nmr';n.innerHTML='<i></i>';n.appendChild(document.createTextNode(c.name));r.appendChild(n);
    [-1,0,1,2,3,4,5,6,7].forEach(v=>{
      const b=document.createElement('button');b.className='hw'+(v<0?' off':'');
      b.textContent=v<0?'Off':(v<4?String(v+1):'M'+(v-3));
      if(v>=0&&!getPat(c,v))b.disabled=true;
      if(draftOf(c)===v)b.classList.add('sel');
      b.addEventListener('click',()=>{draft[c.key]=v;renderSceneEditor()});
      r.appendChild(b);
    });
    g.appendChild(r);
  });
}
function closeSceneEditor(){$('#sceneEd').classList.remove('open');editing=-1}
$('#mcancel').onclick=closeSceneEditor;
$('#mcopy').onclick=()=>{draft=curMap();renderSceneEditor()};
$('#mclear').onclick=()=>{if(editing>=0){scenes[editing]=null;saveScenes()}closeSceneEditor();refreshSlots()};
$('#msave').onclick=()=>{
  if(editing>=0){
    const o={};cols.forEach(c=>{o[c.key]=draftOf(c)});
    scenes[editing]=cols.every(c=>o[c.key]<0)?null:o;saveScenes();
  }
  closeSceneEditor();refreshSlots();
};
const slotEls=[];
function refreshSlots(){slotEls.forEach((b,i)=>{b.classList.toggle('empty',!scenes[i]);b.lastChild.textContent=scenes[i]?'Cena':'Vazia'})}
function buildScenes(){
  const s=$('#scenes');s.innerHTML='';
  for(let i=0;i<8;i++){
    const b=document.createElement('button');b.className='hw sc';
    b.innerHTML='<span class="led"></span><b>'+(i+1)+'</b><span>Cena</span>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();if(editMode||!scenes[i])openSceneEditor(i);else launchScene(i)});
    slotEls.push(b);s.appendChild(b);
  }
  const x=document.createElement('button');x.className='hw sc';x.id='stopall';x.innerHTML=ICON.stop+'Parar';
  x.addEventListener('pointerdown',e=>{e.preventDefault();stopAll()});s.appendChild(x);
  refreshSlots();
}

// ---------- Editor de loops ----------
const ED={ci:-1,kind:'drum',len:16,grid:[],notes:[],rows:[],bar:0,chrom:false,target:0,prev:false,cells:[],pat:null,lastPos:-1};
let painting=null;
const SCALE=[0,2,3,5,7,8,10],NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const inScale=m=>SCALE.includes(((m-9)%12+12)%12);
const nName=m=>NN[m%12]+(Math.floor(m/12)-1);
function firstEmpty(c){const u=userPats[c.key];const i=u.findIndex(p=>!p);return i<0?0:i}

// drums: grade de uma nota (toms com 3 alturas)
function patToGrid(c,pat,len){
  const g=c.rows.map(()=>Array(len).fill(false));
  if(pat&&Array.isArray(pat.data))pat.data.forEach(n=>{
    const st=Array.isArray(n)?n[0]:n;if(st>=len)return;
    let r=0;
    if(Array.isArray(n)&&c.rows.length>1){let best=1e9;c.rows.forEach((row,ri)=>{const dd=Math.abs((row.f||0)-n[1]);if(dd<best){best=dd;r=ri}})}
    g[r][st]=true;
  });
  return g;
}
function gridToData(c){
  const d=[];
  for(let i=0;i<ED.len;i++)c.rows.forEach((row,r)=>{if(ED.grid[r][i])d.push(c.rows.length>1?[i,row.f]:i)});
  return d;
}

// notas: piano roll
function patToNotes(c,pat,len){
  const n=[];
  if(pat&&Array.isArray(pat.data))pat.data.forEach(x=>{
    if(!Array.isArray(x))return;const s=x[0];if(s>=len)return;
    const l=Math.max(1,Math.min(len-s,Math.round(x[2]||1)));
    (Array.isArray(x[1])?x[1]:[x[1]]).forEach(m=>n.push({m,s,l}));
  });
  return n;
}
function notesToData(c){
  const ns=ED.notes.slice().sort((a,b)=>a.s-b.s||a.m-b.m);
  if(c.type==='chord'){
    const g={};ns.forEach(n=>{const k=n.s+':'+n.l;(g[k]=g[k]||{s:n.s,l:n.l,m:[]}).m.push(n.m)});
    return Object.values(g).sort((a,b)=>a.s-b.s).map(x=>[x.s,x.m,x.l,x.l>=8]);
  }
  return ns.map(n=>[n.s,n.m,n.l]);
}
function buildRows(c){
  let [lo,hi]=c.range;
  ED.notes.forEach(n=>{lo=Math.min(lo,n.m);hi=Math.max(hi,n.m)});
  const need=new Set(ED.notes.map(n=>n.m));ED.rows=[];
  for(let m=hi;m>=lo;m--)if(ED.chrom||inScale(m)||need.has(m))ED.rows.push(m);
}
const isMono=()=>cols[ED.ci].type!=='chord';
function noteAt(m,i){return ED.notes.find(n=>n.m===m&&i>=n.s&&i<n.s+n.l)}

function curData(){const c=cols[ED.ci];return ED.kind==='note'?notesToData(c):gridToData(c)}
function syncPreview(){
  const c=cols[ED.ci];ED.pat={len:ED.len,data:curData()};
  if(ED.prev)c.preview=ED.pat;
}
function auditionHit(r){
  const c=cols[ED.ci];if(!ctx)return;const t=ctx.currentTime+.01,o=c.gain;
  switch(c.type){case 'kick':kick(t,o);break;case 'clap':clapOnly(t,o);break;case 'snare':snare(t,o);break;case 'hat':hat(t,o,false);break;case 'ohat':hat(t,o,true);break;case 'perc':rim(t,o);break;case 'tom':tom(t,c.rows[r].f,o);break}
}
function auditionNote(m){
  const c=cols[ED.ci];if(!ctx)return;const t=ctx.currentTime+.01,o=c.gain;
  if(c.type==='bass')bass(t,m,.25,o,0);else if(c.type==='chord')chord(t,[m],.35,false,o);else pluck(t,m,.25,o);
}
function loadInto(c,pat){
  if(ED.kind==='note'){ED.notes=patToNotes(c,pat,ED.len);ED.chrom=ED.notes.some(n=>!inScale(n.m))}

function buildNoteGrid(){

function paintNotes(){
  ED.cells.forEach((row,r)=>{const m=ED.rows[r];row.forEach((e,i)=>{
    const n=noteAt(m,i);
    e.classList.toggle('on',!!n);e.classList.toggle('st',!!n&&i===n.s);e.classList.toggle('end',!!n&&i===n.s+n.l-1);
  })});
}
function noteDown(el){
  const m=ED.rows[+el.dataset.r],i=+el.dataset.i,ex=noteAt(m,i);
  if(ex){ED.notes.splice(ED.notes.indexOf(ex),1);painting={erase:true}}
  else{
    if(isMono()){ // baixo e lead: uma nota por vez
      ED.notes=ED.notes.filter(n=>n.s!==i);
      ED.notes.forEach(n=>{if(n.s<i&&n.s+n.l>i)n.l=i-n.s});
    }
    const n={m,s:i,l:1};ED.notes.push(n);painting={note:n};auditionNote(m);
  }
  paintNotes();syncPreview();
}
function noteMove(el){
  const m=ED.rows[+el.dataset.r],i=+el.dataset.i;
  if(painting.erase){const ex=noteAt(m,i);if(ex){ED.notes.splice(ED.notes.indexOf(ex),1);paintNotes();syncPreview()}return}
  const n=painting.note;if(m!==n.m||i<n.s)return;
  let l=i-n.s+1;
  ED.notes.forEach(o=>{if(o!==n&&o.s>n.s&&(isMono()||o.m===n.m))l=Math.min(l,o.s-n.s)});
  l=Math.min(l,ED.len-n.s);
  if(l!==n.l){n.l=l;paintNotes();syncPreview()}
}
function setCell(el,v){
  const r=+el.dataset.r,i=+el.dataset.i;if(ED.grid[r][i]===v)return;

// ---------- Knobs ----------
function makeKnob(host,{v,label,small,onChange}){
  const sz=small?26:40,c=sz/2,r=sz/2-2.5,A0=-.75*Math.PI,A1=.75*Math.PI;
  host.className='knob'+(small?' sm':'');
  host.innerHTML='<svg viewBox="0 0 '+sz+' '+sz+'"><path class="trk"/><path class="val"/><circle class="cap" cx="'+c+'" cy="'+c+'" r="'+(r-(small?3.5:4.5))+'"/><line class="ptr"/></svg>'+(label?'<span class="lbl">'+label+'</span>':'');
  const trk=host.querySelector('.trk'),val=host.querySelector('.val'),ptr=host.querySelector('.ptr');
  const pt=(a,rad)=>[c+rad*Math.sin(a),c-rad*Math.cos(a)];
  const arc=(a0,a1)=>{const p0=pt(a0,r),p1=pt(a1,r);return 'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+'A'+r+' '+r+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)};
  trk.setAttribute('d',arc(A0,A1));
  function draw(){
    const a=A0+(A1-A0)*v;val.setAttribute('d',v>.005?arc(A0,a):'');
    const q0=pt(a,r*.2),q1=pt(a,r-(small?4.5:6));
    ptr.setAttribute('x1',q0[0]);ptr.setAttribute('y1',q0[1]);ptr.setAttribute('x2',q1[0]);ptr.setAttribute('y2',q1[1]);
  }
  draw();
  let drag=false,sy=0,sv=0;
  host.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();drag=true;sy=e.clientY;sv=v;try{host.setPointerCapture(e.pointerId)}catch(_){}});
  host.addEventListener('pointermove',e=>{if(!drag)return;v=Math.max(0,Math.min(1,sv+(sy-e.clientY)/(small?110:150)));draw();onChange(v)});
  const end=()=>{drag=false};
  host.addEventListener('pointerup',end);host.addEventListener('pointercancel',end);
}

// ---------- Interface ----------
function refreshPads(){
  cols.forEach(c=>c.padEls.forEach((el,pi)=>{
    const pat=getPat(c,pi);
    el.classList.toggle('empty',!pat);
    el.classList.toggle('user',pi>=4&&!!pat);
    c.padNm[pi].textContent=pat?pat.name:'+';
  }));
}
// arrastar alças: altura de linha e largura de coluna
function dragger(el,{down,move,up}){
  let on=false,sx=0,sy=0;
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();on=true;sx=e.clientX;sy=e.clientY;el.classList.add('act');try{el.setPointerCapture(e.pointerId)}catch(_){}down&&down(e)});
  el.addEventListener('pointermove',e=>{if(on)move(e.clientX-sx,e.clientY-sy)});
  const end=()=>{if(!on)return;on=false;el.classList.remove('act');up&&up()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyCols(){
  const s=$('#session');s.style.setProperty('--hw',HW+'px');s.style.setProperty('--sw',SW+'px');
  s.classList.toggle('compact',HW<132);
}
function layoutRows(){
  const g=$('#grid');if(!g||!g._spec)return;
  const auto=screen==='free'?'minmax(44px,92px)':'minmax(38px,1fr)';
  g.style.gridTemplateRows=g._spec.map(x=>typeof x==='string'?x:(x.h?x.h+'px':auto)).join(' ');
}
function rowResizer(el,c,row){
  let sh=0,last=0;
  dragger(el,{
    down:()=>{
      const now=Date.now();
      if(now-last<320){c.h=null;layoutRows();saveLay();flash('Altura automática');last=0;sh=-1;return}
      last=now;sh=row.getBoundingClientRect().height;
    },
    move:(dx,dy)=>{if(sh<0)return;c.h=Math.round(clamp(sh+dy,32,260));layoutRows()},
    up:()=>{if(sh>=0)saveLay()}
  });
}
function colResizer(el,which){
  let s0=0;
  dragger(el,{
    down:()=>{s0=which==='hw'?HW:SW},
    move:dx=>{if(which==='hw')HW=Math.round(clamp(s0+dx,80,280));else SW=Math.round(clamp(s0-dx,90,360));applyCols()},
    up:()=>{LAY.hw=HW;LAY.sw=SW;saveLay()}
  });
}

    FX[k]={on:s.on!==false,style:[0,1,2].includes(s.style)?s.style:0,p,
      links:Array.isArray(s.links)?s.links.filter(x=>typeof x==='string'):[],

})();
let fxSaveT=null;
function saveFx(){
  clearTimeout(fxSaveT);
  fxSaveT=setTimeout(()=>{
    const o={};FXKEYS.forEach(k=>{const F=FX[k];o[k]={on:F.on,style:F.style,p:F.p,links:F.links,win:{x:F.win.x,y:F.win.y,w:F.win.w}}});

const fxOn=(k,c)=>FX[k].on&&FX[k].links.includes(c.key);
const toneHz=v=>600*Math.pow(20,v);

// --- áudio: reverb e delay são "sends"; distorção é inserida em cada linha
const FXA={rev:{},dly:{}};
const REVST=[{t:1,pre:.006,damp:.55},{t:2.6,pre:.022,damp:.35},{t:1.8,pre:.001,damp:.12}];
const DLYST=[{b:.75,lbl:'1/8 pontuado'},{b:.5,pp:true,lbl:'1/8 ping-pong'},{b:1,tape:true,lbl:'1/4 fita'}];
const DST_PRE=[12,30,8],DST_OUT=[.6,.4,.55];
const revLen=()=>REVST[FX.rev.style].t*(.35+FX.rev.p.decay*1.3);
const dlyTime=()=>Math.min(1.9,DLYST[FX.dly.style].b*60/bpm);
const DCACHE={};
function dstCurve(){
  const s=FX.dst.style;if(DCACHE[s])return DCACHE[s];
  const n=2048,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=s===0?Math.tanh(2.5*x)/Math.tanh(2.5):(s===1?Math.max(-1,Math.min(.85,x*3)):Math.round(x*5)/5)}
  return DCACHE[s]=c;
}
function buildFxAudio(){
  const R=FXA.rev;
  R.in=ctx.createGain();R.pre=ctx.createDelay(.5);R.tone=ctx.createBiquadFilter();R.tone.type='lowpass';R.ret=ctx.createGain();R.ret.gain.value=0;
  R.in.connect(R.pre);R.tone.connect(R.ret);R.ret.connect(mix);R.conv=null;
  updRevIR();updRev();
  const D=FXA.dly;
  D.in=ctx.createGain();D.out=ctx.createGain();D.ret=ctx.createGain();D.ret.gain.value=0;
  D.out.connect(D.ret);D.ret.connect(mix);D.nodes=[];D.times=[];
  buildDelayInner();updDly();
}
function makeIR(len,damp){
  const sr=ctx.sampleRate,n=Math.max(64,Math.floor(sr*len)),b=ctx.createBuffer(2,n,sr),fade=Math.min(n,Math.floor(sr*.004));
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);let y=0;
    for(let i=0;i<n;i++){
      const p=i/n,x=(Math.random()*2-1)*Math.exp(-6.9*p);
      y+=(x-y)*Math.max(.04,1-damp*(.2+.8*p));
      d[i]=i<fade?y*i/fade:y;
    }
  }
  return b;
}
function updRevIR(){
  if(!ctx)return;
  const R=FXA.rev,cv=ctx.createConvolver();
  cv.buffer=makeIR(revLen(),REVST[FX.rev.style].damp);
  R.pre.connect(cv);cv.connect(R.tone);
  const old=R.conv;R.conv=cv;
  if(old)setTimeout(()=>{try{R.pre.disconnect(old)}catch(e){}try{old.disconnect()}catch(e){}},60);
}
let irT=null;
function updRevIRSoon(){clearTimeout(irT);irT=setTimeout(updRevIR,140)}
function updRev(){
  if(!ctx)return;const R=FXA.rev,F=FX.rev,t=ctx.currentTime;
  R.pre.delayTime.setTargetAtTime(REVST[F.style].pre,t,.02);
  R.tone.frequency.setTargetAtTime(toneHz(F.p.tone),t,.02);
  R.ret.gain.setTargetAtTime(F.on?F.p.mix*5:0,t,.03);
}
function panNode(v){if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=v;return p}return ctx.createGain()}
function buildDelayInner(){
  const D=FXA.dly,st=DLYST[FX.dly.style],t=dlyTime(),N=[];
  D.nodes.forEach(n=>{try{if(n.stop)n.stop()}catch(e){}try{n.disconnect()}catch(e){}});
  try{D.in.disconnect()}catch(e){}
  const add=n=>{N.push(n);return n};
  const lp=add(ctx.createBiquadFilter());lp.type='lowpass';
  const fb=add(ctx.createGain());fb.gain.value=0;
  if(st.pp){
    const dL=add(ctx.createDelay(2)),dR=add(ctx.createDelay(2)),pL=add(panNode(-.9)),pR=add(panNode(.9));
    dL.delayTime.value=t;dR.delayTime.value=t;
    D.in.connect(dL);dL.connect(pL);pL.connect(D.out);
    dL.connect(dR);dR.connect(lp);lp.connect(pR);pR.connect(D.out);
    lp.connect(fb);fb.connect(dL);
    D.times=[dL,dR];
  }else{
    const d=add(ctx.createDelay(2));d.delayTime.value=t;
    D.in.connect(d);d.connect(lp);lp.connect(D.out);lp.connect(fb);fb.connect(d);
    D.times=[d];
    if(st.tape){
      const o=add(ctx.createOscillator()),og=add(ctx.createGain());
      o.frequency.value=.7;og.gain.value=.0025;o.connect(og);og.connect(d.delayTime);o.start();
    }
  }
  D.nodes=N;D.lp=lp;D.fb=fb;
}
function updDly(){
  if(!ctx)return;const D=FXA.dly,F=FX.dly,t=ctx.currentTime;
  D.fb.gain.setTargetAtTime(Math.min(.88,F.p.fb*.9),t,.02);
  D.lp.frequency.setTargetAtTime(toneHz(F.p.tone)*(DLYST[F.style].tape?.35:1),t,.02);
  D.ret.gain.setTargetAtTime(F.on?F.p.mix*1.1:0,t,.03);
  const dt=dlyTime();D.times.forEach(d=>d.delayTime.setTargetAtTime(dt,t,.03));
}
function makeShaper(c){
  if(c.shaper){try{c.dPre.disconnect()}catch(e){}try{c.shaper.disconnect()}catch(e){}}
  c.shaper=ctx.createWaveShaper();c.shaper.curve=dstCurve();c.shaper.oversample=FX.dst.style===2?'none':'2x';
  c.dPre.connect(c.shaper);c.shaper.connect(c.dTone);
}
function routeLane(c){
  if(!ctx||!c.gain)return;
  const t=ctx.currentTime,D=FX.dst,on=fxOn('dst',c);
  c.dPre.gain.setTargetAtTime(1+D.p.drive*DST_PRE[D.style],t,.02);
  c.dTone.frequency.setTargetAtTime(toneHz(D.p.tone),t,.02);
  c.dDry.gain.setTargetAtTime(on?1-D.p.mix:1,t,.02);
  c.dWet.gain.setTargetAtTime(on?D.p.mix*DST_OUT[D.style]:0,t,.02);
  c.sRev.gain.setTargetAtTime(fxOn('rev',c)?1:0,t,.02);
  c.sDly.gain.setTargetAtTime(fxOn('dly',c)?1:0,t,.02);
}
const routeAll=()=>ALL().forEach(routeLane);
function applyFx(k,param){
  if(ctx){
    if(k==='rev'){if(param==='decay')updRevIRSoon();updRev()}
    else if(k==='dly')updDly();
    else routeAll();
  }
}

  anL=ctx.createAnalyser();anL.fftSize=512;anR=ctx.createAnalyser();anR.fftSize=512;
  sp.connect(anL,0);sp.connect(anR,1);
  anS=ctx.createAnalyser();anS.fftSize=1024;anS.smoothingTimeConstant=.75;fin.connect(anS);
  VZ.bufL=new Float32Array(512);VZ.bufR=new Float32Array(512);VZ.fq=new Uint8Array(anS.frequencyBinCount);
}
function drawViz(){
  if(ctx&&anS){
    const now=performance.now(),pl=peakOf(anL,VZ.bufL),pr=peakOf(anR,VZ.bufR);
    if(pl>=.999||pr>=.999)VZ.clipUntil=now+1500;
    VZ.lvL=Math.max(dbv(pl),VZ.lvL-.025);VZ.lvR=Math.max(dbv(pr),VZ.lvR-.025);
    setLvl(elL,VZ.lvL);setLvl(elR,VZ.lvR);
    clipLed.classList.toggle('hot',now<VZ.clipUntil);
    cols.forEach(c=>{
      if(!c.an||!c.lmEl)return;
      const v=Math.max(dbv(peakOf(c.an,VZ.lb)),(c.lv||0)-.03);c.lv=v;
      if(Math.abs(v-(c.lvS==null?-1:c.lvS))>.008){c.lvS=v;setLvl(c.lmEl,v)}
    });
    anS.getByteFrequencyData(VZ.fq);
  }
  VZ.pulse*=.88;
  if(ctx)while(PQ.length&&PQ[0].t<=ctx.currentTime){const q=PQ.shift();if(q.v>VZ.pulse)VZ.pulse=q.v}
  if(VZ.pulse<.01)VZ.pulse=0;
  if(Math.abs(VZ.pulse-VZ.lastP)>.01){
    VZ.lastP=VZ.pulse;const p=VZ.pulse;
    lightsEl.style.opacity=(.35+p*.65).toFixed(3);laserEl.style.opacity=(.15+p*.85).toFixed(3);
    markEl.style.filter=p>.02?'drop-shadow(0 0 '+Math.round(2+p*10)+'px rgba(255,90,150,'+(.25+p*.55).toFixed(2)+'))':'none';
  }
  drawSpec();
}
function drawSpec(){
  const dpr=window.devicePixelRatio||1,w=spec.clientWidth,h=spec.clientHeight;
  if(!w||!h)return;
  const W=Math.round(w*dpr),H=Math.round(h*dpr);
  if(spec.width!==W||spec.height!==H||!VZ.sg){spec.width=W;spec.height=H;VZ.sg=sctx.createLinearGradient(0,H,0,0);VZ.sg.addColorStop(0,'#ffb000');VZ.sg.addColorStop(1,'#ff2bd6')}
  const n=Math.max(16,Math.min(96,Math.floor(w/9)));
  if(!VZ.bars||VZ.bars.length!==n){VZ.bars=new Float32Array(n);VZ.caps=new Float32Array(n)}
  sctx.clearRect(0,0,W,H);
  const fq=VZ.fq,binHz=ctx?ctx.sampleRate/1024:46.875,f0=35,f1=16000,bw=W/n,gap=Math.max(1,Math.round(bw*.28));
  for(let i=0;i<n;i++){
    let m=0;
    if(fq){
      const a=Math.floor(f0*Math.pow(f1/f0,i/n)/binHz),b=Math.max(a+1,Math.floor(f0*Math.pow(f1/f0,(i+1)/n)/binHz));
      for(let k=a;k<b&&k<fq.length;k++)if(fq[k]>m)m=fq[k];
    }
    VZ.bars[i]=Math.max(m/255,VZ.bars[i]-.04);VZ.caps[i]=Math.max(VZ.bars[i],VZ.caps[i]-.008);
    const v=VZ.bars[i],bh=Math.max(dpr,v*(H-3*dpr)),x=i*bw;
    sctx.globalAlpha=.25+v*.75;sctx.fillStyle=VZ.sg;sctx.fillRect(x,H-bh,bw-gap,bh);
    if(VZ.caps[i]>.02){sctx.globalAlpha=.9;sctx.fillStyle='#ffffff';sctx.fillRect(x,H-VZ.caps[i]*(H-3*dpr)-2*dpr,bw-gap,1.5*dpr)}
  }
  sctx.globalAlpha=1;
}

// ---------- Boas-vindas, início e navegação ----------
const GENRES=[{k:'house',c1:'#ffb000',c2:'#ff6a3d',desc:'Groove clássico'},{k:'acid',c1:'#ff2bd6',c2:'#8a5cff',desc:'Baixo 303 ácido'}];
function wavePath(amp,y0,per){let d='';for(let x=0;x<=800;x+=8){const y=y0+amp*Math.sin(2*Math.PI*x/per);d+=(x?'L':'M')+x+' '+y.toFixed(1)}return d}
function buildHome(){
  const box=$('#cards');box.innerHTML='';
  GENRES.forEach((g,i)=>{
    const S=STYLES[g.k],b=document.createElement('button');b.className='card';
    b.style.setProperty('--c1',g.c1);b.style.setProperty('--c2',g.c2);b.style.setProperty('--i',i);
    b.innerHTML='<span class="bg"></span>'+
      '<svg class="wave" viewBox="0 0 800 90" preserveAspectRatio="none"><path d="'+wavePath(22,45,200)+'" fill="none" stroke="'+g.c1+'" stroke-width="2" opacity=".75"/></svg>'+
      '<svg class="wave w2" viewBox="0 0 800 90" preserveAspectRatio="none"><path d="'+wavePath(14,50,400)+'" fill="none" stroke="'+g.c2+'" stroke-width="2" opacity=".55"/></svg>'+
      '<span class="cgo"><svg viewBox="0 0 16 16"><path d="M5 2.5v11L13.5 8z"/></svg></span>'+
      '<span class="cname"></span><span class="cmeta"></span>';
    b.querySelector('.cname').textContent=S.name;
    b.querySelector('.cmeta').textContent=S.bpm+' BPM · '+g.desc;
    b.onclick=()=>enterGenre(g.k);box.appendChild(b);
  });
  const n=document.createElement('button');n.className='card soon';n.disabled=true;n.style.setProperty('--i',GENRES.length);
  n.innerHTML='<span class="plus">+</span><span class="badge">SOON</span><span class="cname">Criar novo</span><span class="cmeta">Monte seu próprio gênero</span>';
  box.appendChild(n);
}
function enterGenre(k){
  initAudio();setStyle(k);
  document.body.classList.add('in-session');
  const d=document.querySelector('.dev');d.classList.remove('enter');void d.offsetWidth;d.classList.add('enter');
  setScreen(screen);
}
function goHome(){
  if(playing)stopTransport();
  FXKEYS.forEach(k=>{if(FX[k].win.open)closeFx(k)});
  document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));
  document.body.classList.remove('in-session');
}
$('#homeBtn').addEventListener('click',goHome);
buildHome();
(()=>{const w=$('#welcome');setTimeout(()=>w.classList.add('out'),1000);setTimeout(()=>{w.style.display='none'},1500)})();

function setBpm(v){bpm=Math.max(70,Math.min(170,Math.round(v)));$('#bpmv').textContent=bpm;setBpmDelay()}
function setStyle(k){
  style=k;setBpm(STYLES[k].bpm);
  document.querySelectorAll('#styleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  refreshPads();lastKey='';
}

$('#editIco').innerHTML=ICON.edit;
$('#editTog').onclick=()=>{
  editMode=!editMode;$('#editTog').classList.toggle('on',editMode);
  document.body.classList.toggle('editing',editMode);
};
$('#play').addEventListener('click',()=>{
  initAudio();
  if(playing){stopTransport();return}
  if(!cols.length){flash('Adicione um instrumento');return}
  if(scenes[0]){launchScene(0);return}
  cols[0].active=0;startTransport();
});
$('#bm').onclick=()=>setBpm(bpm-1);
$('#bp').onclick=()=>setBpm(bpm+1);
(()=>{ // arrastar o BPM no display
  const el=$('#lcdBpm');let drag=false,sy=0,sb=0;
  el.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;sy=e.clientY;sb=bpm;try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(drag)setBpm(sb+(sy-e.clientY)/5)});
  const end=()=>{drag=false};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
})();
makeKnob($('#kFilt'),{v:K.fv,label:'Filtro',onChange:v=>{K.fv=v;setFilter()}});
makeKnob($('#kMst'),{v:K.mv,label:'Master',onChange:v=>{K.mv=v;setMaster()}});

let lastMsg='',lastPos='';
function render(){
  if(ctx)while(uiQ.length&&uiQ[0].t<=ctx.currentTime){const q=uiQ.shift();cur=q.s;curBar=q.b}
  const key=cur+':'+curBar,stepChanged=key!==lastKey;
  if(stepChanged)lastKey=key;
  const pos=(playing&&cur>=0)?(curBar+1)+'.'+(Math.floor(cur/4)+1)+'.'+(cur%4+1):'1.1.1';
  if(pos!==lastPos){lastPos=pos;$('#lcdPos').textContent=pos}
  const msg=msgTxt||(editMode?(screen==='free'?'Editar: loops, cenas ou remover linhas':'Editar: toque num loop ou cena'):STYLES[style].name+' · '+(screen==='free'?'Livre · ':'')+(sceneOn>=0?'Cena '+(sceneOn+1):(playing?'Livre':'Parado')));
  if(msg!==lastMsg){lastMsg=msg;$('#lcdMsg').textContent=msg}
  slotEls.forEach((b,i)=>b.classList.toggle('on',playing&&sceneOn===i));
  cols.forEach(c=>{
    c.padEls.forEach((el,i)=>{
      const a=c.active===i;
      el.classList.toggle('play',a);
      el.classList.toggle('q',c.queued===i||(a&&c.queued===-1));
    });
    const pat=c.active>=0?getPat(c,c.active):null;
    const want=(playing&&pat)?c.active:-1;
    if(c.pgIdx!==want){if(c.pgIdx>=0&&c.padPg[c.pgIdx])c.padPg[c.pgIdx].style.width='0';c.pgIdx=want}
    if(want>=0&&stepChanged&&cur>=0){const L=pat.len||16,p=(L===32?(curBar%2)*16:0)+cur;c.padPg[want].style.width=((p+1)/L*100)+'%'}
    const half=(pat&&pat.len===32)?curBar%2:0,k2=c.active+':'+style+':'+userVer+':'+half;
    if(c.shown!==k2){c.shown=k2;const h=hitsOf(pat,half);c.cells.forEach((e,i)=>e.classList.toggle('hit',h.has(i)))}
    if(stepChanged)c.cells.forEach((e,i)=>e.classList.toggle('ph',playing&&i===cur));
  });
  if(ED.ci>=0){
    const p=(playing&&ED.prev&&cur>=0)?(ED.len===32?(curBar%2)*16:0)+cur:-1;
    if(p!==ED.lastPos){
      ED.cells.forEach(row=>{if(row[ED.lastPos])row[ED.lastPos].classList.remove('ph');if(p>=0&&row[p])row[p].classList.add('ph')});
      ED.lastPos=p;
    }
  }
  drawViz();
  requestAnimationFrame(render);
}

buildScenes();
setStyle('house');
setScreen('main');
setPlayUI();
render();
})();
</script>
